<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edema Assessment Hub</title>
<style>
:root{--bg:#f4f7f9;--card:#fff;--ink:#14212b;--mut:#5b6b78;--pri:#0f766e;--pri2:#e0f2ef;--bd:#d9e2e8;--warn:#b45309;--warnbg:#fef3c7;--red:#b91c1c;--redbg:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161c;--card:#16222b;--ink:#e6edf2;--mut:#93a4b1;--pri:#2dd4bf;--pri2:#12332f;--bd:#2a3a46;--warn:#fbbf24;--warnbg:#3a2e0e;--red:#f87171;--redbg:#3b1717}}
:root[data-theme="dark"]{--bg:#0e161c;--card:#16222b;--ink:#e6edf2;--mut:#93a4b1;--pri:#2dd4bf;--pri2:#12332f;--bd:#2a3a46;--warn:#fbbf24;--warnbg:#3a2e0e;--red:#f87171;--redbg:#3b1717}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{color:#04211e}}
header h1{margin:0;font-size:19px}header p{margin:2px 0 0;font-size:12px;opacity:.9}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font-size:14px}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{color:#04211e}}
main{max-width:820px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:10px 0 4px;color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--ink);padding:7px 11px;border-radius:18px;font-size:13.5px;text-align:left}
.chip.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-size:15px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#04211e}}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--bd)}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin:4px 0 6px}.bar i{display:block;height:100%;background:var(--pri)}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.red{background:var(--redbg);color:var(--red);border-radius:10px;padding:10px;font-size:13.5px;margin:8px 0}
ul{margin:4px 0 8px;padding-left:20px}li{margin:2px 0}
details{border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--card)}
summary{padding:11px 12px;font-weight:600;cursor:pointer}details>div{padding:0 12px 10px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--pri2);color:var(--pri)}
input[type=search]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font-size:15px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);font-size:14px}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#14532d}.opt.no{border-color:var(--red);background:var(--redbg);color:var(--red)}
small,.mut{color:var(--mut)}
</style></head><body>
<header><h1>🫘 Edema Assessment Hub</h1><p>Based on Harrison’s Ch. 41 (Loscalzo) · updated with current guideline-based management</p></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const F=[["bil","Bilateral leg edema, dependent"],["uni","Unilateral limb edema"],["peri","Periorbital / facial edema, worst in morning"],["dys","Orthopnea / PND / exertional dyspnea"],["jvp","Raised JVP, S3 or basal crackles"],["asc","Ascites"],["liv","Stigmata of chronic liver disease (jaundice, spider angiomata)"],["pro","Heavy proteinuria (≥3.5 g/day) or foamy urine"],["alb","Serum albumin <3.0 g/dL"],["cr","Raised creatinine / uremic features"],["htn","Hypertension"],["var","Varicosities, venous stasis skin changes"],["nonp","Non-pitting, thickened skin"],["drug","Recent edema-causing drug (CCB, NSAID, steroid, TZD, minoxidil, estrogen…)"],["thy","Cold intolerance, bradycardia, dry skin"],["svc","Face/neck/arm edema with distended chest-wall veins"],["dvt","Acute painful swollen calf"],["cyc","Cyclical, weight fluctuation in premenopausal woman"],["mal","Prolonged poor protein/calorie intake"],["bnp","Elevated BNP / NT-proBNP, cardiomegaly"]];
const C=[
{n:"Heart failure",f:["bil","dys","jvp","bnp","asc"],h:"Edema in dependent areas, worse by evening; elevated JVP, S3, ↑ natriuretic peptides. Confirm with echo.",t:["Loop diuretic titrated to euvolemia (e.g. furosemide 20–40 mg or torsemide 10–20 mg once/twice daily; IV in decompensation, 2.5× home dose is a common start)","Resistant: increase loop dose, or add a thiazide-type diuretic (sequential nephron blockade) — 2022 AHA/ACC/HFSA 2a, ESC 2021 2a","HFrEF: add GDMT — ARNI/ACEi/ARB, β-blocker, MRA, SGLT2i","Sodium moderation, daily weights, monitor K⁺/creatinine"]},
{n:"Cirrhosis / hepatic",f:["asc","liv","alb","bil"],h:"Ascites first (upstream of portal congestion), later leg edema; low/normal JVP and BP; stigmata of liver disease.",t:["Sodium restriction ~2 g/day (88 mmol) plus spironolactone ± furosemide (usually 100 mg : 40 mg ratio)","Target loss ≤0.5 kg/day with ascites only; up to 1 kg/day if peripheral edema present (AASLD 2021)","Large-volume paracentesis with albumin (6–8 g per L removed if >5 L)","Avoid NSAIDs, ACEi/ARB; watch for SBP, hyponatremia, hepatorenal syndrome; evaluate for transplant/TIPS in refractory ascites"]},
{n:"Nephrotic syndrome",f:["peri","pro","alb","bil","htn"],h:"Periorbital edema in the morning, generalized pitting edema; proteinuria ≥3.5 g/d, albumin <3.0, hyperlipidemia.",t:["Treat underlying glomerular disease (biopsy-guided; KDIGO 2021)","Sodium <2 g/day; loop diuretic (often higher doses/split; add thiazide or amiloride if resistant)","ACEi/ARB for proteinuria and BP; statin for hyperlipidemia","Assess thrombosis risk (low albumin, esp. membranous) — consider prophylactic anticoagulation"]},
{n:"Chronic kidney disease / acute GN",f:["cr","htn","bil","pro"],h:"Primary renal sodium retention; hypertension; hematuria in acute GN; uremic symptoms in advanced CKD.",t:["Sodium restriction; loop diuretics (higher doses needed as GFR falls)","Add thiazide-type agent if resistant; SGLT2i/ACEi/ARB for CKD per KDIGO","Dialysis/ultrafiltration if refractory or oliguric overload"]},
{n:"Chronic venous insufficiency",f:["uni","var","bil"],h:"Foot/ankle edema, worse standing, hemosiderin pigmentation, lipodermatosclerosis, ulcers.",t:["Compression 20–30 mmHg after excluding significant arterial disease (ABI)","Leg elevation, exercise, skin care","Venous ablation for refractory disease; diuretics are generally not helpful"]},
{n:"Deep vein thrombosis",f:["uni","dvt"],h:"Acute unilateral swelling with calf pain; use Wells score + D-dimer + duplex.",t:["Urgent duplex ultrasound","Anticoagulation (DOAC first-line) if confirmed","Compression for symptom control"]},
{n:"Lymphedema",f:["uni","nonp","bil"],h:"Non-pitting later, skin thickening, Stemmer sign; causes include filariasis, nodal resection, radiation, genetic.",t:["Complete decongestive therapy: manual lymph drainage, compression bandaging, skin care, exercise","Treat cellulitis promptly; diuretics have little role","Treat cause (e.g. filariasis: DEC/albendazole per regional protocol)"]},
{n:"Drug-induced",f:["drug","bil"],h:"Mechanisms: renal vasoconstriction (NSAIDs, cyclosporine), arteriolar dilation (dihydropyridine CCBs, hydralazine, minoxidil), sodium retention (steroids, estrogens, TZDs).",t:["Stop or reduce the offending drug if possible","Dihydropyridine CCB: consider ACEi/ARB co-therapy or switch","Diuretics less effective for CCB edema (precapillary dilation)"]},
{n:"Hypothyroid (myxedema)",f:["thy","nonp","peri"],h:"Non-pitting edema from hyaluronic acid deposition; also Graves’ pretibial myxedema.",t:["TSH/free T4; levothyroxine replacement","Diuretics ineffective"]},
{n:"Nutritional / hypoalbuminemic",f:["mal","alb","bil"],h:"Famished states; edema may worsen on refeeding (insulin-mediated sodium retention); beriberi: high-output state.",t:["Gradual nutritional repletion with monitoring","Thiamine if beriberi suspected","Avoid aggressive diuresis in intravascular depletion"]},
{n:"SVC obstruction",f:["svc","peri"],h:"Face, neck and upper-extremity edema with venous distension.",t:["Urgent CT venography","Treat cause (tumor, thrombosis); stenting/anticoagulation as indicated"]},
{n:"Idiopathic cyclic edema",f:["cyc","bil"],h:"Diagnosis of exclusion in women; diurnal weight gain.",t:["Exclude cardiac, renal, hepatic, thyroid causes","Sodium moderation, avoid diuretic overuse, reassure"]}];
const P=[["Starling forces: five mechanisms","Edema = excess clinically evident interstitial fluid. Develops with (1) ↑ intracapillary hydrostatic pressure, (2) inadequate lymphatic drainage, (3) ↓ plasma oncotic pressure, (4) capillary endothelial damage, (5) ↑ interstitial oncotic pressure. About ⅔ of body water is intracellular, ⅓ extracellular; ¼ of ECF is plasma."],["Effective arterial blood volume","Underfilling of the arterial tree from ↓ cardiac output, ↓ systemic vascular resistance (cirrhosis, sepsis, AV fistula, pregnancy) or hypoalbuminemia triggers neurohumoral activation (SNS, RAAS, AVP) that retains Na⁺ and water — restoring effective volume but worsening edema."],["RAAS","↓ renal perfusion → renin release → angiotensin II (efferent constriction, ↑ filtration fraction, ↑ proximal reabsorption) → aldosterone (collecting-duct Na⁺ reabsorption, K⁺ excretion). Blocked by ACEi/ARB, spironolactone/eplerenone, amiloride."],["Arginine vasopressin","Released by effective volume depletion (nonosmotic stimulus); V₂ receptors ↑ free-water reabsorption → dilutional hyponatremia in HF/cirrhosis."],["Natriuretic peptides & endothelin-1","ANP/BNP promote natriuresis and vasodilation but are insufficient (resistance) in edematous states. Endothelin-1 is elevated in severe HF, causing renal vasoconstriction and Na⁺ retention."],["Heart failure","Impaired ventricular emptying/relaxation → venous congestion at expense of effective arterial volume; SNS/RAAS activation → renal Na⁺ retention."],["Renal disease","Acute GN: primary Na⁺/water retention with normal/high output. Nephrotic: ↓ oncotic pressure (≥3.5 g/d protein loss, albumin <3.0) → plasma volume contraction → RAAS activation; edema diffuse, periorbital in morning."],["Hepatic cirrhosis","Hepatic venous outflow obstruction ↑ splanchnic volume and lymph; portal hypertension → ascites first; later peripheral edema with hypoalbuminemia and vasodilation; reduced aldosterone metabolism."],["Localized edema","Venous obstruction/valve failure (↑ hydrostatic pressure), lymphatic obstruction (filariasis, nodal resection, primary lymphedema), SVC obstruction, unilateral paralysis."],["Distribution clues","HF: legs, evening, dependent (sacral if bed-bound). Nephrotic: face/eyelids, morning. Unilateral: venous/lymphatic. Face/neck/arms: SVC obstruction."]];
const Q=[["Which finding best distinguishes nephrotic edema?",["Periorbital edema worse in the morning","Raised JVP","Unilateral leg swelling","Palmar erythema"],0],["Maximum safe fluid loss in cirrhosis with ascites but no peripheral edema?",["≤0.5 kg/day","2 kg/day","3 kg/day","No limit"],0],["Resistant edema on high-dose loop diuretic: guideline-supported next step?",["Add a thiazide-type diuretic","Stop diuretic","Add verapamil","Fluid load"],0],["Which drug class causes edema through arteriolar dilation?",["Dihydropyridine CCB","ACE inhibitor","Loop diuretic","Statin"],0],["Nephrotic syndrome is defined by proteinuria of at least:",["3.5 g/day","1 g/day","0.5 g/day","150 mg/day"],0],["Why may edema worsen on refeeding famished patients?",["Insulin-mediated tubular sodium reabsorption","Hypercalcemia","Hyperthyroidism","Lymphatic fibrosis"],0],["Cardiac edema typically sits…",["In dependent portions, worse in evening","Only periorbital","Only upper limb","Non-pitting only"],0],["Which is NOT in the five Starling mechanisms for edema?",["↓ interstitial oncotic pressure","↑ capillary hydrostatic pressure","Lymphatic inadequacy","Endothelial damage"],0]];
const T=[["Home",""],["Assess",""],["Pathophysiology",""],["Treatment",""],["Learn",""],["Search",""]];
let tab=1,sel=new Set(),qi=0,qs=0,ans=null;
const $=s=>document.querySelector(s),esc=s=>s;
function nav(){ $("#nav").innerHTML=T.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="go(${i})">${t[0]}</button>`).join("") }
function go(i){tab=i;render();window.scrollTo(0,0)}
function tg(id){sel.has(id)?sel.delete(id):sel.add(id);render()}
function score(){return C.map(c=>({c,m:c.f.filter(x=>sel.has(x)).length,s:c.f.filter(x=>sel.has(x)).length/c.f.length})).filter(r=>r.m>0).sort((a,b)=>b.s-a.s||b.m-a.m)}
function tx(c){return `<h3>${c.n}</h3><p>${c.h}</p><ul>${c.t.map(x=>"<li>"+x+"</li>").join("")}</ul>`}
function render(){nav();let h="";
if(tab==0)h=`<div class="card"><h2>Edema: overview</h2><p>Edema is excess interstitial fluid. A weight gain of several kilograms precedes overt generalized edema. Use the tabs to assess a patient, review mechanisms, plan treatment and test yourself.</p><div class="chips"><button class="btn" onclick="go(1)">Start assessment</button><button class="btn g" onclick="go(4)">Quiz</button></div></div><div class="card"><h2>First questions</h2><ul><li>Localized or generalized?</li><li>If generalized: albumin <3.0 g/dL? Heart failure, liver, kidney disease, drugs?</li><li>Is pulmonary edema present? It is the only life-threatening form requiring immediate treatment.</li></ul></div><div class="note">Educational aid for clinicians. Not a substitute for clinical judgement; verify doses against local protocols.</div>`;
if(tab==1){const r=score();h=`<div class="card"><h2>Select findings</h2><div class="chips">${F.map(f=>`<button class="chip ${sel.has(f[0])?"on":""}" onclick="tg('${f[0]}')">${f[1]}</button>`).join("")}</div><p><button class="btn g" onclick="sel.clear();render()">Clear</button></p></div><div class="card"><h2>Likely causes</h2>${r.length?r.map(x=>`<div><b>${x.c.n}</b> <small>${x.m}/${x.c.f.length} features</small><div class="bar"><i style="width:${Math.round(x.s*100)}%"></i></div></div>`).join(""):"<p class='mut'>Select findings to rank causes.</p>"}${sel.has("dys")||sel.has("jvp")?'<div class="red">Dyspnea with congestion: assess for pulmonary edema and treat urgently.</div>':""}${sel.has("svc")?'<div class="red">Possible SVC obstruction: urgent imaging.</div>':""}${sel.has("dvt")?'<div class="red">Suspected DVT: urgent duplex ultrasound.</div>':""}</div>${r.slice(0,2).map(x=>`<div class="card">${tx(x.c)}</div>`).join("")}<div class="card"><h3>Suggested work-up</h3><ul><li>Urinalysis, urine protein/creatinine, serum albumin, creatinine</li><li>Liver panel, INR, TSH</li><li>ECG, NT-proBNP, echocardiography</li><li>Venous duplex if unilateral</li></ul></div>`}
if(tab==2)h=P.map(p=>`<details><summary>${p[0]}</summary><div>${p[1]}</div></details>`).join("");
if(tab==3)h=`<div class="card"><h2>General principles</h2><ul><li>Treat the cause first; diuretics are symptomatic.</li><li>Loop diuretics first-line for volume overload; sodium restriction.</li><li>Rate: pulmonary edema, HF, nephrotic can be removed rapidly; cirrhosis with ascites only ≤0.5–1 kg/day.</li><li>Resistance: higher/split loop doses, switch agent, add thiazide ± MRA, consider ultrafiltration.</li></ul></div>${C.map(c=>`<details><summary>${c.n}</summary><div>${tx(c)}</div></details>`).join("")}<div class="card"><h3>Drugs associated with edema (Table 41-2)</h3><p>NSAIDs; vasodilators (hydralazine, clonidine, methyldopa, guanethidine, minoxidil); calcium channel blockers; α-blockers; thiazolidinediones; steroid hormones (glucocorticoids, anabolic steroids, estrogens, progestins); cyclosporine; growth hormone; interleukin-2; OKT3.</p></div><div class="card"><h3>Sources</h3><small>Harrison’s Principles of Internal Medicine, Ch. 41; 2022 AHA/ACC/HFSA HF guideline; 2021 ESC HF guideline; AASLD 2021 ascites/SBP/HRS guidance; KDIGO 2021 glomerular disease; Novak &amp; Ellison, AJKD Core Curriculum 2022.</small></div>`;
if(tab==4){if(qi>=Q.length)h=`<div class="card"><h2>Score ${qs}/${Q.length}</h2><button class="btn" onclick="qi=0;qs=0;ans=null;render()">Restart</button></div>`;else{const q=Q[qi];const o=q[1].map((t,i)=>[t,i]).sort((a,b)=>(a[0].length*7+qi*3+a[1])%5-(b[0].length*7+qi*3+b[1])%5);h=`<div class="card"><small>Question ${qi+1}/${Q.length}</small><h2>${q[0]}</h2>${o.map(([t,i])=>`<button class="opt ${ans!==null?(i==q[2]?"ok":(i==ans?"no":"")):""}" ${ans!==null?"disabled":""} onclick="pick(${i})">${t}</button>`).join("")}${ans!==null?`<p><button class="btn" onclick="qi++;ans=null;render()">Next</button></p>`:""}</div>`}}
if(tab==5)h=`<input type="search" id="q" placeholder="Search cause, drug, feature…" oninput="srch()"><div id="res"></div>`;
$("#main").innerHTML=h;if(tab==5)srch()}
function pick(i){ans=i;if(i==Q[qi][2])qs++;render()}
function srch(){const v=($("#q").value||"").toLowerCase();const r=v?C.filter(c=>(c.n+c.h+c.t.join(" ")).toLowerCase().includes(v)):C;$("#res").innerHTML=r.map(c=>`<div class="card">${tx(c)}</div>`).join("")||"<p class='mut'>No matches.</p>"}
render();
</script></body></html>
